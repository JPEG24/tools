<!DOCTYPE html>
<html lang="ja">
	<head>
		<title>百人一首</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<style>
			body {
				font-family: "Noto Sans JP", sans-serif;
				margin-left: 25px;
			}
			#mode {
				gap: 10px;
				margin: 30px 0;
			}
			.radio {
				display: flex;
				gap: 10px;
			}
			#statement {
				font-size: 1.5em;
				margin: 20px 0;
			}
			#buttons {
				display: flex;
				gap: 20px;
				margin: 10px 0;
				#utility {
					display: flex;
					gap: 10px;
					font-weight: bold;
				}
				#support {
					display: flex;
					gap: 10px;
				}
			}
			#answer {
				width: 40em;
				font-size: 1.2em;
			}
		</style>
	</head>
	<body>
		<h1>百人一首</h1>
		<div id="mode">
			<fieldset style="margin: 10px 0;">
				<legend><b>モード選択</b></legend>
				<div class="radio">
					<label><input type="radio" name="mode" value="all">全文</label>
					<label><input type="radio" name="mode" value="part">初句から全文</label>
					<label><input type="radio" name="mode" value="first">一部</label>
					<label><input type="radio" name="mode" value="author">作者名</label>
				</div>
			</fieldset>
			出題範囲を指定：
			<label><input id="range-from" type="number" name="range" min="1" max="100" value="1"></label>
			～
			<label><input id="range-to" type="number" name="range" min="1" max="100" value="100"></label>
		</div>

		<p id="statement">モードを選択してください</p>

		<div id="buttons">
			<div id="utility">
				<button id="submit"><strong>解答</strong></button>
				<button id="question"><strong>出題</strong></button>
			</div>
			<div id="support">
				<button id="wi" onclick="insertText('ゐ')">ゐ</button>
				<button id="we" onclick="insertText('ゑ')">ゑ</button>
			</div>
		</div>

		<input type="text" id="answer">

    <h2>入力のルール</h2>
    <ul>
      <!--TODO-->
    </ul>
    <a href="../index.html">ホームへ戻る</a>
	</body>
</html>
<script>
  import { TANKA, TANKA_KANJI, AUTHORS } from "../lib/tanka.js";
	function insertText(text) {
		document.getElementById('answer').value += text;
	}
</script>
